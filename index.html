<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Huy Dep Trai</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(19, 27, 46, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding: 30px 15px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1050px; margin: 0 auto; display: none; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 22px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .card h2 {
            font-size: 1.1rem;
            color: #a78bfa;
            margin: 0 0 18px 0;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: 1 / -1; }

        label { font-size: 0.82rem; color: var(--text-sub); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        input, select {
            padding: 11px 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
            width: 100%;
        }

        input:focus, select:focus { border-color: var(--accent); }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            transition: transform 0.15s ease, opacity 0.15s ease;
            will-change: transform;
        }

        .btn:hover { opacity: 0.92; transform: translateY(-2px); }
        .btn-success { background: #10b981; }
        .btn-warning { background: #f59e0b; color: #000; font-weight: 700; }
        .btn-danger { background: #ef4444; }

        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 0.88rem; }
        th { color: var(--text-sub); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; }

        /* OVERLAY ĐĂNG NHẬP */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(15px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        .login-box i.main-icon { font-size: 3rem; color: var(--accent); margin-bottom: 15px; }
        .login-box h2 { margin: 0 0 8px 0; font-size: 1.4rem; }
        .login-box p { color: var(--text-sub); font-size: 0.88rem; margin-bottom: 20px; }
        .login-box input { margin-bottom: 16px; text-align: center; font-size: 1.1rem; letter-spacing: 3px; }
        .login-box button { width: 100%; justify-content: center; padding: 12px; font-size: 0.95rem; }

        /* TOAST NOTIFICATION */
        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 0.88rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show { transform: translateX(0); }
        .toast-success { background: rgba(16, 185, 129, 0.9); }
        .toast-error { background: rgba(239, 68, 68, 0.9); }
        .toast-info { background: rgba(139, 92, 246, 0.9); }
        .toast-warning { background: rgba(245, 158, 11, 0.95); color: #000; }
    </style>
</head>
<body>

    <div id="toastContainer"></div>

    <!-- OVERLAY ĐĂNG NHẬP -->
    <div id="loginOverlay">
        <div class="login-box">
            <i class="fas fa-user-shield main-icon"></i>
            <h2>XÁC NHẬN ADMIN</h2>
            <p>Nhập mật khẩu quản trị để đăng nhập</p>
            <input type="password" id="adminPasswordInput" placeholder="••••••••" onkeypress="handlePassKey(event)">
            <button class="btn" onclick="checkPassword()"><i class="fas fa-key"></i> Đăng Nhập</button>
        </div>
    </div>

    <!-- MAIN ADMIN CONTAINER -->
    <div class="container" id="adminContainer">
        <div class="top-bar">
            <h1><i class="fas fa-user-gear"></i> Trang Quản Lý Admin</h1>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-warning" onclick="resetToDefault()"><i class="fas fa-rotate-left"></i> KHÔI PHỤC CÀI ĐẶT GỐC</button>
                <button class="btn btn-danger" onclick="logoutAdmin()"><i class="fas fa-right-from-bracket"></i> Đăng Xuất</button>
            </div>
        </div>

        <!-- CẤU HÌNH TIÊU ĐỀ -->
        <div class="card">
            <h2><span><i class="fas fa-heading"></i> Cấu Hình Tiêu Đề Website</span></h2>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Tiêu Đề Chính (H1)</label>
                    <input type="text" id="siteTitleInput" placeholder="Roblox Executors Status">
                </div>
                <div class="form-group full-width">
                    <label>Dòng Mô Tả Phụ (Subtitle)</label>
                    <input type="text" id="siteSubtitleInput" placeholder="Trạng thái cập nhật liên tục...">
                </div>
            </div>
        </div>

        <!-- THÊM MỚI -->
        <div class="card">
            <h2><span><i class="fas fa-plus-circle"></i> Thêm Executor Mới</span></h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Tên Executor</label>
                    <input type="text" id="addName" placeholder="Ví dụ: Potassium">
                </div>
                <div class="form-group">
                    <label>Nền Tảng</label>
                    <select id="addPlat">
                        <option value="Windows">Windows</option>
                        <option value="Android">Android</option>
                        <option value="iOS">iOS</option>
                        <option value="Mac">Mac</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Trạng Thái</label>
                    <select id="addStatus">
                        <option value="WORKING">WORKING</option>
                        <option value="PATCHED">PATCHED</option>
                        <option value="UNSTABLE">UNSTABLE</option>
                        <option value="OUTDATED">OUTDATED</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Giá Tiền</label>
                    <input type="text" id="addPrice" placeholder="Free hoặc 549k">
                </div>
                <div class="form-group">
                    <label>Thời Gian Cập Nhật</label>
                    <input type="text" id="addTime" placeholder="Ví dụ: Cập nhật sau">
                </div>
                <div class="form-group">
                    <label>Ghi Chú</label>
                    <input type="text" id="addNote" placeholder="Ghi chú thêm...">
                </div>
            </div>
            <button class="btn" onclick="addExecutor()"><i class="fas fa-plus"></i> Thêm Vào Bảng</button>
        </div>

        <!-- BẢNG CHÍNH -->
        <div class="card">
            <div class="top-bar" style="margin-bottom: 10px;">
                <h2 style="border:none; margin:0; padding:0;"><span><i class="fas fa-list"></i> Danh Sách Hiển Thị Trang Chủ</span></h2>
                <button class="btn btn-success" onclick="saveAllData()"><i class="fas fa-cloud-arrow-up"></i> LƯU & ĐỒNG BỘ LÊN WEBSITES</button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Tên</th>
                            <th>Nền tảng</th>
                            <th>Trạng thái</th>
                            <th>Giá</th>
                            <th>Cập nhật</th>
                            <th>Ghi chú</th>
                            <th>Xóa</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "quanghuy90";
        const API_URL = "https://api.npoint.io/9d78b91f5a0f7c9f5ec8";

        // DỮ LIỆU CÀI ĐẶT GỐC MẶC ĐỊNH CHUẨN 100%
        const DEFAULT_TITLE = "Roblox Executors Status";
        const DEFAULT_SUBTITLE = "Trạng thái cập nhật liên tục các Executor cho Windows, Android, iOS & Mac";
        const DEFAULT_ITEMS = [
            { name: "Velocity", plat: "Windows", status: "WORKING", price: "Free", time: "Cập nhật sau", note: "-" },
            { name: "SirHurt", plat: "Windows", status: "WORKING", price: "none", time: "Cập nhật sau", note: "-" },
            { name: "Xeno", plat: "Windows", status: "WORKING", price: "Free", time: "Cập nhật sau", note: "-" },
            { name: "Potassium", plat: "Windows", status: "WORKING", price: "549k", time: "Cập nhật sau", note: "-" },
            { name: "Volt", plat: "Windows", status: "WORKING", price: "149 - 499k", time: "Cập nhật sau", note: "-" },
            { name: "Wave", plat: "Windows", status: "WORKING", price: "139 - 489k", time: "Cập nhật sau", note: "-" },
            { name: "Ronix", plat: "Windows", status: "OUTDATED", price: "Free", time: "Cập nhật sau", note: "-" },
            { name: "Synapse Z", plat: "Windows", status: "OUTDATED", price: "none", time: "Cập nhật sau", note: "-" },
            { name: "Seliware", plat: "Windows", status: "OUTDATED", price: "none", time: "Cập nhật sau", note: "-" },
            { name: "Madium V2", plat: "Windows", status: "WORKING", price: "Free", time: "Cập nhật sau", note: "-" },
            { name: "Cosmic", plat: "Windows", status: "UNSTABLE", price: "none", time: "Cập nhật sau", note: "-" }
        ];

        let siteTitle = DEFAULT_TITLE;
        let siteSubtitle = DEFAULT_SUBTITLE;
        let itemsList = [];

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function checkPassword() {
            const pwd = document.getElementById('adminPasswordInput').value;
            if (pwd === ADMIN_PASSWORD) {
                sessionStorage.setItem('admin_auth', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                showToast("Đăng nhập thành công!", "success");
                loadAdminData();
            } else {
                showToast("Mật khẩu không đúng!", "error");
            }
        }

        function handlePassKey(e) { if (e.key === 'Enter') checkPassword(); }
        function logoutAdmin() { sessionStorage.removeItem('admin_auth'); location.reload(); }

        if (sessionStorage.getItem('admin_auth') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'block';
            loadAdminData();
        }

        async function loadAdminData() {
            try {
                const res = await fetch(API_URL + "?t=" + new Date().getTime());
                const data = await res.json();

                if (Array.isArray(data)) {
                    itemsList = data;
                } else if (data && typeof data === 'object') {
                    siteTitle = data.title || siteTitle;
                    siteSubtitle = data.subtitle || siteSubtitle;
                    itemsList = Array.isArray(data.items) ? data.items : [];
                }

                document.getElementById('siteTitleInput').value = siteTitle;
                document.getElementById('siteSubtitleInput').value = siteSubtitle;
                renderAdminTable();
            } catch (err) {
                showToast("Lỗi tải dữ liệu!", "error");
            }
        }

        function renderAdminTable() {
            const tbody = document.getElementById('adminTableBody');
            if (itemsList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: var(--text-sub);">Chưa có mục nào. Hãy bấm "KHÔI PHỤC CÀI ĐẶT GỐC" hoặc thêm mới!</td></tr>`;
                return;
            }

            tbody.innerHTML = itemsList.map((item, index) => `
                <tr>
                    <td><input type="text" value="${item.name || ''}" oninput="updateItem(${index}, 'name', this.value)"></td>
                    <td>
                        <select onchange="updateItem(${index}, 'plat', this.value)">
                            <option value="Windows" ${item.plat === 'Windows' ? 'selected' : ''}>Windows</option>
                            <option value="Android" ${item.plat === 'Android' ? 'selected' : ''}>Android</option>
                            <option value="iOS" ${item.plat === 'iOS' ? 'selected' : ''}>iOS</option>
                            <option value="Mac" ${item.plat === 'Mac' ? 'selected' : ''}>Mac</option>
                        </select>
                    </td>
                    <td>
                        <select onchange="updateItem(${index}, 'status', this.value)">
                            <option value="WORKING" ${item.status === 'WORKING' ? 'selected' : ''}>WORKING</option>
                            <option value="PATCHED" ${item.status === 'PATCHED' ? 'selected' : ''}>PATCHED</option>
                            <option value="UNSTABLE" ${item.status === 'UNSTABLE' ? 'selected' : ''}>UNSTABLE</option>
                            <option value="OUTDATED" ${item.status === 'OUTDATED' ? 'selected' : ''}>OUTDATED</option>
                        </select>
                    </td>
                    <td><input type="text" value="${item.price || ''}" oninput="updateItem(${index}, 'price', this.value)"></td>
                    <td><input type="text" value="${item.time || ''}" oninput="updateItem(${index}, 'time', this.value)"></td>
                    <td><input type="text" value="${item.note || ''}" oninput="updateItem(${index}, 'note', this.value)"></td>
                    <td><button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.82rem;" onclick="deleteItem(${index})"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        function updateItem(index, key, value) { itemsList[index][key] = value; }

        // XÓA MỤC TRỰC TIẾP
        function deleteItem(index) {
            const removed = itemsList.splice(index, 1)[0];
            renderAdminTable();
            showToast(`Đã xóa ${removed.name || 'mục'}! Nhớ bấm LƯU để áp dụng.`, "info");
        }

        // KHÔI PHỤC VỀ CÀI ĐẶT GỐC VÀ TỰ ĐỒNG BỘ NGAY LẬP TỨC
        async function resetToDefault() {
            if (confirm("XÁC NHẬN: Bạn có chắc chắn muốn KHÔI PHỤC TOÀN BỘ danh sách & tiêu đề về CÀI ĐẶT GỐC ban đầu?")) {
                siteTitle = DEFAULT_TITLE;
                siteSubtitle = DEFAULT_SUBTITLE;
                itemsList = JSON.parse(JSON.stringify(DEFAULT_ITEMS));

                document.getElementById('siteTitleInput').value = siteTitle;
                document.getElementById('siteSubtitleInput').value = siteSubtitle;

                renderAdminTable();
                await saveAllData();
                showToast("Đã KHÔI PHỤC CÀI ĐẶT GỐC thành công!", "success");
            }
        }

        function addExecutor() {
            const name = document.getElementById('addName').value.trim();
            if (!name) {
                showToast("Vui lòng nhập tên Executor!", "error");
                return;
            }

            itemsList.unshift({
                name: name,
                plat: document.getElementById('addPlat').value,
                status: document.getElementById('addStatus').value,
                price: document.getElementById('addPrice').value.trim() || 'Free',
                time: document.getElementById('addTime').value.trim() || 'Cập nhật sau',
                note: document.getElementById('addNote').value.trim() || '-'
            });

            document.getElementById('addName').value = '';
            document.getElementById('addPrice').value = '';
            document.getElementById('addTime').value = '';
            document.getElementById('addNote').value = '';

            renderAdminTable();
            showToast(`Đã thêm "${name}" (Nhớ bấm LƯU & ĐỒNG BỘ)`, "info");
        }

        async function saveAllData() {
            const payload = {
                title: document.getElementById('siteTitleInput').value.trim() || DEFAULT_TITLE,
                subtitle: document.getElementById('siteSubtitleInput').value.trim() || DEFAULT_SUBTITLE,
                items: itemsList
            };

            showToast("Đang đồng bộ dữ liệu...", "info");

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showToast("ĐÃ ĐỒNG BỘ THÀNH CÔNG LÊN WEBSITES!", "success");
                } else {
                    showToast("Lưu thất bại!", "error");
                }
            } catch (err) {
                showToast("Lỗi kết nối máy chủ!", "error");
            }
        }
    </script>
</body>
</html>
