<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Huy Dep Trai</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg: #030712; 
            --glass: rgba(15, 23, 42, 0.85); 
            --accent: #8b5cf6; 
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Outfit', sans-serif; 
            min-height: 100vh;
            padding: 30px 15px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 1.1rem;
            color: #a78bfa;
            margin: 0 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: 1 / -1; }

        label { font-size: 0.85rem; color: var(--text-sub); font-weight: 500; }

        input, select {
            padding: 10px 12px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus { border-color: var(--accent); }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; padding: 6px 12px; font-size: 0.8rem; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.9rem; }
        th { color: var(--text-sub); font-size: 0.8rem; text-transform: uppercase; }

        .status-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 10px;
            background: #10b981;
            color: white;
            font-weight: 600;
            display: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 99;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><i class="fas fa-user-gear"></i> Trang Quản Lý Admin</h1>

        <!-- CẤU HÌNH TIÊU ĐỀ TRANG WEB -->
        <div class="card">
            <h2><i class="fas fa-heading"></i> Cấu Hình Tiêu Đề & Mô Tả Trang Web</h2>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Tiêu Đề Chính (H1)</label>
                    <input type="text" id="siteTitleInput" placeholder="Ví dụ: Roblox Executors Status">
                </div>
                <div class="form-group full-width">
                    <label>Dòng Mô Tả Phụ (Subtitle)</label>
                    <input type="text" id="siteSubtitleInput" placeholder="Ví dụ: Trạng thái cập nhật liên tục các Executor...">
                </div>
            </div>
        </div>

        <!-- QUẢN LÝ DANH SÁCH EXECUTOR -->
        <div class="card">
            <h2><i class="fas fa-plus-circle"></i> Thêm Executor Mới</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Tên Executor</label>
                    <input type="text" id="addName" placeholder="Ví dụ: Potassium">
                </div>
                <div class="form-group">
                    <label>Nền Tảng</label>
                    <select id="addPlat">
                        <option value="Windows">Windows</option>
                        <option value="Android">Android</option>
                        <option value="iOS">iOS</option>
                        <option value="Mac">Mac</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Trạng Thái</label>
                    <select id="addStatus">
                        <option value="WORKING">WORKING</option>
                        <option value="PATCHED">PATCHED</option>
                        <option value="UNSTABLE">UNSTABLE</option>
                        <option value="OUTDATED">OUTDATED</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Giá Tiền</label>
                    <input type="text" id="addPrice" placeholder="Ví dụ: Free hoặc 549k">
                </div>
                <div class="form-group">
                    <label>Thời Gian Cập Nhật</label>
                    <input type="text" id="addTime" placeholder="Ví dụ: Vừa cập nhật">
                </div>
                <div class="form-group">
                    <label>Ghi Chú</label>
                    <input type="text" id="addNote" placeholder="Ghi chú thêm...">
                </div>
            </div>
            <button class="btn" onclick="addExecutor()"><i class="fas fa-plus"></i> Thêm Vào Danh Sách</button>
        </div>

        <!-- DANH SÁCH & NÚT LƯU -->
        <div class="card">
            <div class="top-bar">
                <h2 style="border:none; margin:0; padding:0;"><i class="fas fa-list"></i> Danh Sách Executor Hiện Tại</h2>
                <button class="btn btn-success" onclick="saveAllData()"><i class="fas fa-cloud-arrow-up"></i> LƯU & ĐỒNG BỘ LÊN WEBSITES</button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Tên</th>
                            <th>Nền tảng</th>
                            <th>Trạng thái</th>
                            <th>Giá</th>
                            <th>Cập nhật</th>
                            <th>Ghi chú</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Render JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="status-toast">Đã đồng bộ thành công!</div>

    <script>
        const API_URL = "https://api.npoint.io/9d78b91f5a0f7c9f5ec8";

        let siteTitle = "Roblox Executors Status";
        let siteSubtitle = "Trạng thái cập nhật liên tục các Executor cho Windows, Android, iOS & Mac";
        let itemsList = [];

        async function loadAdminData() {
            try {
                const res = await fetch(API_URL + "?t=" + new Date().getTime());
                const data = await res.json();

                if (Array.isArray(data)) {
                    itemsList = data;
                } else if (data && typeof data === 'object') {
                    siteTitle = data.title || siteTitle;
                    siteSubtitle = data.subtitle || siteSubtitle;
                    itemsList = Array.isArray(data.items) ? data.items : [];
                }

                document.getElementById('siteTitleInput').value = siteTitle;
                document.getElementById('siteSubtitleInput').value = siteSubtitle;
                renderAdminTable();
            } catch (err) {
                console.error("Lỗi khi tải dữ liệu:", err);
            }
        }

        function renderAdminTable() {
            const tbody = document.getElementById('adminTableBody');
            if (itemsList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: var(--text-sub);">Chưa có dữ liệu. Hãy thêm mới!</td></tr>`;
                return;
            }

            tbody.innerHTML = itemsList.map((item, index) => `
                <tr>
                    <td><input type="text" value="${item.name || ''}" onchange="updateItem(${index}, 'name', this.value)"></td>
                    <td>
                        <select onchange="updateItem(${index}, 'plat', this.value)">
                            <option value="Windows" ${item.plat === 'Windows' ? 'selected' : ''}>Windows</option>
                            <option value="Android" ${item.plat === 'Android' ? 'selected' : ''}>Android</option>
                            <option value="iOS" ${item.plat === 'iOS' ? 'selected' : ''}>iOS</option>
                            <option value="Mac" ${item.plat === 'Mac' ? 'selected' : ''}>Mac</option>
                        </select>
                    </td>
                    <td>
                        <select onchange="updateItem(${index}, 'status', this.value)">
                            <option value="WORKING" ${item.status === 'WORKING' ? 'selected' : ''}>WORKING</option>
                            <option value="PATCHED" ${item.status === 'PATCHED' ? 'selected' : ''}>PATCHED</option>
                            <option value="UNSTABLE" ${item.status === 'UNSTABLE' ? 'selected' : ''}>UNSTABLE</option>
                            <option value="OUTDATED" ${item.status === 'OUTDATED' ? 'selected' : ''}>OUTDATED</option>
                        </select>
                    </td>
                    <td><input type="text" value="${item.price || ''}" onchange="updateItem(${index}, 'price', this.value)"></td>
                    <td><input type="text" value="${item.time || ''}" onchange="updateItem(${index}, 'time', this.value)"></td>
                    <td><input type="text" value="${item.note || ''}" onchange="updateItem(${index}, 'note', this.value)"></td>
                    <td><button class="btn btn-danger" onclick="deleteItem(${index})"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        function updateItem(index, key, value) {
            itemsList[index][key] = value;
        }

        function deleteItem(index) {
            itemsList.splice(index, 1);
            renderAdminTable();
        }

        function addExecutor() {
            const name = document.getElementById('addName').value.trim();
            if (!name) {
                alert("Vui lòng nhập tên Executor!");
                return;
            }

            itemsList.unshift({
                name: name,
                plat: document.getElementById('addPlat').value,
                status: document.getElementById('addStatus').value,
                price: document.getElementById('addPrice').value.trim() || 'Free',
                time: document.getElementById('addTime').value.trim() || 'Vừa xong',
                note: document.getElementById('addNote').value.trim() || ''
            });

            document.getElementById('addName').value = '';
            document.getElementById('addPrice').value = '';
            document.getElementById('addTime').value = '';
            document.getElementById('addNote').value = '';

            renderAdminTable();
        }

        async function saveAllData() {
            const payload = {
                title: document.getElementById('siteTitleInput').value.trim() || "Roblox Executors Status",
                subtitle: document.getElementById('siteSubtitleInput').value.trim() || "Trạng thái cập nhật liên tục các Executor",
                items: itemsList
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showToast("Đã lưu Tiêu đề & Danh sách lên máy chủ!");
                } else {
                    alert("Lưu thất bại, thử lại sau!");
                }
            } catch (err) {
                console.error(err);
                alert("Lỗi kết nối máy chủ!");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2500);
        }

        loadAdminData();
    </script>
</body>
</html>
